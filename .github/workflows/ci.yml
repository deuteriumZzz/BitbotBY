name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "torch>=2.0.0" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e "backend[dev]"

      - name: Check formatting with black
        run: black --check backend

      - name: Lint with ruff
        run: ruff check backend

      - name: Check layer boundaries (import-linter)
        working-directory: backend
        run: lint-imports

      - name: Type check with mypy
        working-directory: backend
        run: mypy bitbot

      - name: Syntax check
        run: python -m compileall -q backend/bitbot launcher

      - name: Run tests with coverage
        run: pytest backend/tests --ignore=backend/tests/integration -v --tb=short --cov=bitbot --cov-report=term-missing --cov-fail-under=50

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  frontend:
    name: Frontend (tests & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build

  integration:
    name: Integration tests (Bybit testnet)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' }}
    env:
      BYBIT_TESTNET_API_KEY: ${{ secrets.BYBIT_TESTNET_API_KEY }}
      BYBIT_TESTNET_API_SECRET: ${{ secrets.BYBIT_TESTNET_API_SECRET }}
      PAPER_TRADING: "true"
      TESTNET: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install --upgrade pip && pip install "torch>=2.0.0" --extra-index-url https://download.pytorch.org/whl/cpu && pip install -e "backend[dev]"

      - name: Run integration tests
        if: ${{ env.BYBIT_TESTNET_API_KEY != '' }}
        run: pytest backend/tests/integration/ -m integration -v

      - name: Skip (secrets not configured)
        if: ${{ env.BYBIT_TESTNET_API_KEY == '' }}
        run: echo "⚠️ BYBIT_TESTNET_API_KEY not set — integration tests skipped. Add secrets in repo Settings → Secrets."

  backtest-smoke:
    name: Backtest smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install --upgrade pip && pip install "torch>=2.0.0" --extra-index-url https://download.pytorch.org/whl/cpu && pip install -e "backend[dev]"

      - name: Backtest import and structure check
        run: |
          python -c "
          from bitbot.research import backtest
          assert callable(backtest.run_strategy), 'run_strategy missing'
          assert callable(backtest.load_data), 'load_data missing'
          assert callable(backtest.aggregate_results), 'aggregate_results missing'
          assert callable(backtest.print_report), 'print_report missing'
          print('backend/bitbot/research/backtest.py structure OK')
          "

      - name: Backtest live smoke (BTC/USDT, 1 month, 4h)
        continue-on-error: true
        timeout-minutes: 3
        env:
          BT_SYMBOL: BTC/USDT
          BT_MONTHS: "1"
          BT_TIMEFRAME: 4h
          PAPER_TRADING: "true"
        run: python -m bitbot.research.backtest
