<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BitbotBY — AI-гибридный торговый бот для Bybit Futures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="55%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#121c3a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="headFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182747"/>
      <stop offset="100%" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14203d"/>
      <stop offset="100%" stop-color="#0c1428"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1c2947" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="220" y1="0" x2="220" y2="360"/>
    <line x1="340" y1="0" x2="340" y2="360"/>
    <line x1="460" y1="0" x2="460" y2="360"/>
    <line x1="580" y1="0" x2="580" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="820" y1="0" x2="820" y2="360"/>
    <line x1="940" y1="0" x2="940" y2="360"/>
    <line x1="1060" y1="0" x2="1060" y2="360"/>
    <line x1="1180" y1="0" x2="1180" y2="360"/>
  </g>

  <!-- background candlestick uptrend, right side -->
  <g opacity="0.5">
    <line x1="888" y1="120" x2="888" y2="165" stroke="#34d399" stroke-width="2"/>
    <rect x="882" y="125" width="12" height="30" fill="#34d399"/>
    <line x1="920" y1="105" x2="920" y2="140" stroke="#34d399" stroke-width="2"/>
    <rect x="914" y="109" width="12" height="20" fill="#34d399"/>
    <line x1="952" y1="115" x2="952" y2="150" stroke="#f87171" stroke-width="2"/>
    <rect x="946" y="119" width="12" height="18" fill="#f87171"/>
    <line x1="984" y1="75" x2="984" y2="120" stroke="#34d399" stroke-width="2"/>
    <rect x="978" y="80" width="12" height="30" fill="#34d399"/>
    <line x1="1016" y1="60" x2="1016" y2="95" stroke="#34d399" stroke-width="2"/>
    <rect x="1010" y="64" width="12" height="20" fill="#34d399"/>
    <line x1="1048" y1="70" x2="1048" y2="105" stroke="#f87171" stroke-width="2"/>
    <rect x="1042" y="74" width="12" height="18" fill="#f87171"/>
    <line x1="1080" y1="35" x2="1080" y2="80" stroke="#34d399" stroke-width="2"/>
    <rect x="1074" y="40" width="12" height="30" fill="#34d399"/>
    <line x1="1112" y1="20" x2="1112" y2="55" stroke="#34d399" stroke-width="2"/>
    <rect x="1106" y="24" width="12" height="20" fill="#34d399"/>
    <line x1="1144" y1="30" x2="1144" y2="65" stroke="#f87171" stroke-width="2"/>
    <rect x="1138" y="34" width="12" height="18" fill="#f87171"/>
  </g>

  <!-- robot -->
  <g transform="translate(80,60)">
    <!-- antenna -->
    <line x1="90" y1="0" x2="90" y2="-22" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="-30" r="10" fill="#0e1830" stroke="#34d399" stroke-width="3"/>
    <circle cx="90" cy="-30" r="4" fill="#5eead4"/>

    <!-- head -->
    <rect x="10" y="0" width="160" height="130" rx="26" fill="url(#headFill)" stroke="#2dd4bf" stroke-width="3"/>

    <!-- circuit lines on head -->
    <g stroke="#22d3ee" stroke-width="2" opacity="0.5" fill="none">
      <path d="M22 20 h20 v10 h14"/>
      <path d="M158 22 h-18 v14 h-12"/>
      <path d="M22 112 h16 v-10 h16"/>
    </g>

    <!-- eyes -->
    <circle cx="60" cy="58" r="17" fill="#0c1428"/>
    <circle cx="60" cy="58" r="17" fill="#22d3ee" opacity="0.18"/>
    <circle cx="60" cy="58" r="9" fill="#5eead4"/>
    <circle cx="120" cy="58" r="17" fill="#0c1428"/>
    <circle cx="120" cy="58" r="17" fill="#22d3ee" opacity="0.18"/>
    <circle cx="120" cy="58" r="9" fill="#5eead4"/>

    <!-- grille / mouth -->
    <rect x="52" y="92" width="76" height="16" rx="8" fill="#0c1428" stroke="#22344f" stroke-width="2"/>
    <line x1="64" y1="94" x2="64" y2="106" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>
    <line x1="78" y1="94" x2="78" y2="106" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>
    <line x1="92" y1="94" x2="92" y2="106" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>
    <line x1="106" y1="94" x2="106" y2="106" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>
    <line x1="116" y1="94" x2="116" y2="106" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>

    <!-- neck -->
    <rect x="70" y="130" width="40" height="14" fill="#101c38"/>

    <!-- body -->
    <rect x="0" y="144" width="180" height="120" rx="20" fill="url(#bodyFill)" stroke="#22344f" stroke-width="3"/>

    <!-- chest screen: mini uptrend line the bot is "reading" -->
    <rect x="24" y="166" width="132" height="70" rx="10" fill="#0a1226" stroke="#1c2947" stroke-width="2"/>
    <polyline points="34,222 58,206 80,214 104,188 128,196 148,174" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="148" cy="174" r="5" fill="#5eead4"/>
    <path d="M138 172 l10 -6 l4 11 z" fill="#5eead4"/>

    <!-- shoulder lights -->
    <circle cx="-8" cy="180" r="8" fill="#34d399"/>
    <circle cx="188" cy="180" r="8" fill="#22d3ee"/>
  </g>

  <!-- title -->
  <text x="330" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)">BitbotBY</text>
  <text x="333" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#9aa7c2">AI-гибридный торговый бот для Bybit Futures</text>

  <!-- tag pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c7d2e8">
    <rect x="333" y="245" width="150" height="30" rx="15" fill="#132038" stroke="#243456" stroke-width="1"/>
    <text x="349" y="265">AI · SAC · Chronos</text>

    <rect x="493" y="245" width="130" height="30" rx="15" fill="#132038" stroke="#243456" stroke-width="1"/>
    <text x="509" y="265">Long / Short</text>

    <rect x="633" y="245" width="160" height="30" rx="15" fill="#132038" stroke="#243456" stroke-width="1"/>
    <text x="649" y="265">Kelly · CVaR · A-C</text>
  </g>
</svg>
