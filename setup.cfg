[flake8]
max-line-length = 88
extend-ignore =
    # black-incompatible whitespace rules
    E203,
    W503,
    # uppercase mock-class variables in tests are fine
    N806,
per-file-ignores =
    # шаблоны plist/systemd и длинные сообщения пользователю
    launcher/launch.py:E501,
    # sys.path.insert before imports is intentional
    dashboard.py: E402, E501
    # скрипты исследований: длинные строки отчётов, sys.path до импортов
    src/research/*.py: E402, E501
    tests/conftest.py: E402
    tests/core/test_risk_manager.py: E402
    # test files: long mock paths and patch strings often exceed 88 chars
    tests/*.py: E501
    src/market/data_loader.py: I001, I005, E501
    # try/except import guard — isort cannot reorder conditional imports
    src/telegram_bot/notifier.py: I001, I005
    # ccxt.async_support sub-module import ordering
    src/exchange/bybit_api.py: I001, I005

[isort]
profile = black
