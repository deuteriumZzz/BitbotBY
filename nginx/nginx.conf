server {
    listen 8080;

    location / {
        auth_basic "BitbotBY Dashboard";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://dashboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Приложение (Telegram MiniApp, десктоп): без basic auth — MiniApp не умеет
    # её проходить, а заголовок Authorization занят сессией приложения. Доступ
    # проверяет сам дашборд: сессия из входа через Telegram или DASHBOARD_API_KEY.
    location /app/ {
        proxy_pass http://dashboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API старого дашборда (страница на /) — по-прежнему за basic auth.
    location ~ ^/api/(status|trades|backtest)$ {
        auth_basic "BitbotBY Dashboard";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://dashboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://dashboard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ws {
        proxy_pass http://dashboard:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
