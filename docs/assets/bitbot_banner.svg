<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BitbotBY — AI-гибридный торговый бот для Bybit: биржа, AI и Telegram подключены к боту, бот ведёт сделки, уведомления и приложение">
  <!-- Стиль «Тёмный премиум-терминал» (webapp/DESIGN.md): палитра «Сталь», один акцент — зелёный роста, карта связей как во вкладке «Настройки». -->
  <defs>
    <radialGradient id="glowRun" cx="0" cy="1" r="0.75">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowUp" cx="0.74" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#4BE08A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4BE08A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1E23"/>
      <stop offset="1" stop-color="#15181C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#CBD2DB"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1E2228"/>
    </pattern>
    <radialGradient id="fade" cx="0.3" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotsMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <symbol id="logo" viewBox="0 0 24 24">
      <path d="M12 1.5 21.5 7v10L12 22.5 2.5 17V7z" fill="url(#mark)"/>
      <path d="M9 7h4.2a2.6 2.6 0 0 1 1.4 4.8A2.8 2.8 0 0 1 13.4 17H9zm2 2v2.8h2a1.4 1.4 0 0 0 0-2.8zm0 4.6V15h2.3a1.45 1.45 0 0 0 0-2.9H11z" fill="#08090B"/>
    </symbol>
    <style>
      text { font-family: Geist, Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .ink { fill: #E6EAEF; } .ink2 { fill: #A3ABB6; } .ink3 { fill: #828B97; }
      .base { fill: none; stroke: #2A2F36; stroke-width: 1.5; }
      .flow { fill: none; stroke: #4BE08A; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 0.1 9; animation: flow 1.4s linear infinite; }
      .live { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -9.1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .flow, .live { animation: none; } }
    </style>
  </defs>

  <!-- фон: глубокий тёмный, едва заметная точечная сетка и два мягких отсвета -->
  <rect width="1200" height="360" rx="20" fill="#08090B"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)" mask="url(#dotsMask)" opacity="0.8"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowRun)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowUp)"/>

  <!-- слева: знак, название, что это, три факта пилюлями -->
  <use href="#logo" x="72" y="94" width="50" height="50"/>
  <text x="136" y="137" class="ink" font-size="50" font-weight="700" letter-spacing="-1.5">BitbotBY</text>
  <text x="72" y="194" class="ink" font-size="24" font-weight="500" letter-spacing="-0.3">AI-гибридный торговый бот для Bybit</text>
  <text x="72" y="224" class="ink2" font-size="16">Фьючерсы и спот · Telegram, браузер и десктоп</text>

  <g font-size="14">
    <rect x="72" y="252" width="176" height="32" rx="16" fill="#15181C" stroke="#2A2F36"/>
    <circle cx="91" cy="268" r="4" fill="#4BE08A" class="live"/>
    <text x="104" y="273" class="ink">Paper по умолчанию</text>
    <rect x="258" y="252" width="158" height="32" rx="16" fill="#15181C" stroke="#2A2F36"/>
    <text x="275" y="273" class="ink2">16 AI-провайдеров</text>
    <rect x="426" y="252" width="128" height="32" rx="16" fill="#15181C" stroke="#2A2F36"/>
    <text x="443" y="273" class="ink2">SAC · Chronos</text>
  </g>

  <!-- справа: карточка «Система» — карта связей из вкладки «Настройки» -->
  <rect x="630" y="40" width="520" height="280" rx="16" fill="#101215" stroke="#1E2228"/>
  <rect x="630" y="40" width="520" height="280" rx="16" fill="url(#sheen)"/>
  <text x="656" y="74" class="ink3" font-size="13">Система</text>
  <text x="656" y="100" class="ink" font-size="20" font-weight="600" letter-spacing="-0.3">Всё подключено</text>
  <circle cx="1104" cy="84" r="22" fill="none" stroke="#1B1F24" stroke-width="5"/>
  <circle cx="1104" cy="84" r="22" fill="none" stroke="#4BE08A" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2 138.2" transform="rotate(-90 1104 84)"/>
  <text x="1104" y="89" class="ink" font-size="13" font-weight="600" text-anchor="middle">4/4</text>

  <!-- связи: серая основа и бегущие по ней зелёные точки -->
  <path class="base" d="M810 156 C 838 156, 828 212, 856 212"/>
  <path class="base" d="M810 212 L 856 212"/>
  <path class="base" d="M810 268 C 838 268, 828 212, 856 212"/>
  <path class="base" d="M924 212 C 952 212, 942 156, 970 156"/>
  <path class="base" d="M924 212 L 970 212"/>
  <path class="base" d="M924 212 C 952 212, 942 268, 970 268"/>
  <path class="flow" d="M810 156 C 838 156, 828 212, 856 212"/>
  <path class="flow" d="M810 212 L 856 212"/>
  <path class="flow" d="M810 268 C 838 268, 828 212, 856 212"/>
  <path class="flow" d="M924 212 C 952 212, 942 156, 970 156"/>
  <path class="flow" d="M924 212 L 970 212"/>
  <path class="flow" d="M924 212 C 952 212, 942 268, 970 268"/>

  <!-- что питает бота -->
  <g font-size="14">
    <rect x="654" y="134" width="156" height="44" rx="12" fill="url(#node)" stroke="#2A4A38"/>
    <circle cx="672" cy="156" r="4" fill="#4BE08A"/>
    <text x="686" y="153" class="ink" font-weight="600">Bybit</text>
    <text x="686" y="169" class="ink3" font-size="11.5">ключ ••••a9F2</text>
    <rect x="654" y="190" width="156" height="44" rx="12" fill="url(#node)" stroke="#2A4A38"/>
    <circle cx="672" cy="212" r="4" fill="#4BE08A"/>
    <text x="686" y="209" class="ink" font-weight="600">AI-провайдеры</text>
    <text x="686" y="225" class="ink3" font-size="11.5">в цепочке 3</text>
    <rect x="654" y="246" width="156" height="44" rx="12" fill="url(#node)" stroke="#2A4A38"/>
    <circle cx="672" cy="268" r="4" fill="#4BE08A"/>
    <text x="686" y="265" class="ink" font-weight="600">Telegram</text>
    <text x="686" y="281" class="ink3" font-size="11.5">управление из чата</text>
  </g>

  <!-- бот -->
  <circle cx="890" cy="212" r="34" fill="#15181C" stroke="#2A2F36" stroke-width="1.5"/>
  <circle cx="890" cy="212" r="40" fill="none" stroke="#4BE08A" stroke-opacity="0.25" class="live"/>
  <use href="#logo" x="874" y="196" width="32" height="32"/>
  <text x="890" y="268" class="ink" font-size="13" font-weight="600" text-anchor="middle">BitbotBY</text>
  <text x="890" y="284" class="ink3" font-size="11.5" text-anchor="middle">работает</text>

  <!-- что он отдаёт -->
  <g font-size="14">
    <rect x="970" y="134" width="156" height="44" rx="12" fill="url(#node)" stroke="#2A4A38"/>
    <circle cx="988" cy="156" r="4" fill="#4BE08A"/>
    <text x="1002" y="153" class="ink" font-weight="600">Сделки</text>
    <text x="1002" y="169" class="ink3" font-size="11.5">Paper · без риска</text>
    <rect x="970" y="190" width="156" height="44" rx="12" fill="url(#node)" stroke="#2A4A38"/>
    <circle cx="988" cy="212" r="4" fill="#4BE08A"/>
    <text x="1002" y="209" class="ink" font-weight="600">Уведомления</text>
    <text x="1002" y="225" class="ink3" font-size="11.5">в Telegram</text>
    <rect x="970" y="246" width="156" height="44" rx="12" fill="url(#node)" stroke="#2A4A38"/>
    <circle cx="988" cy="268" r="4" fill="#4BE08A"/>
    <text x="1002" y="265" class="ink" font-weight="600">Приложение</text>
    <text x="1002" y="281" class="ink3" font-size="11.5">MiniApp · браузер</text>
  </g>
</svg>
